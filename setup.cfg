[autopep8]
max-line-length = 120
in-place = true
recursive = true


exclude =
    migrations
    __pycache__
    venv
    .venv
    .env
    env
    node_modules
    build
    dist
    .git
    .hg
    .mypy_cache
    .tox
    *.pyc
    .pytest_cache
    logs

ignore =
    E226
    E302
    E41
    W503
    E501